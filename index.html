<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mamá ❤️</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ff2e63">

<link rel="stylesheet" href="style.css">
</head>

<body>

<canvas id="bg"></canvas>

<audio id="musica" loop>
  <source src="audio/musica.mp3">
</audio>

<div id="app">

<!-- INTRO CINEMÁTICA -->
<div id="intro" class="center fade">
  <h1>💖 Feliz Día Mamá</h1>
  <p>Una historia hecha con amor...</p>
  <button class="btn" onclick="start()">Comenzar</button>
</div>

<!-- MENU EMOCIONAL -->
<div id="menu" class="hidden">

  <div class="card" onclick="openGallery('reir')">
    😄 ¿Querés reírte junto a Isa?
  </div>

  <div class="card" onclick="openGallery('emocion')">
    🥹 ¿Querés emocionarte?
  </div>

  <div class="card" onclick="openGallery('familia')">
    👨‍👩‍👧 Mirá qué hermosa familia tenés
  </div>

  <div class="card glow" onclick="finalSurprise()">
    💕 Ponete junto a Isa (sorpresa final)
  </div>

</div>

<!-- VIEWER -->
<div id="viewer" class="hidden">

  <button class="btn small" onclick="back()">⬅ Menú</button>

  <div id="content"></div>

  <div class="nav">
    <button class="btn" onclick="prev()">⬅</button>
    <button class="btn" onclick="next()">➡</button>
  </div>

</div>

<!-- SELFIE FINAL -->
<div id="selfie" class="hidden center">

  <h2 class="love">💖 Ponete junto a Isa</h2>

  <video id="cam" autoplay playsinline></video>

  <button class="btn" onclick="capture()">📸 Sacar foto</button>

  <canvas id="canvas" class="hidden"></canvas>

  <div id="result"></div>

  <button class="btn" onclick="backToMenu()">Volver</button>

</div>

</div>

<script src="app.js"></script>

<script>
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("./service-worker.js");
}
</script>

</body>
</html>
