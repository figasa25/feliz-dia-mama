<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sofi ❤️</title>

<!-- PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ff2e63">

<link rel="stylesheet" href="style.css">
</head>

<body>

<!-- FONDO -->
<canvas id="bg"></canvas>

<!-- ===== AUDIOS ===== -->
<audio id="feliz" src="audio/feliz dia.mp3"></audio>
<audio id="sos" src="audio/sos la mejor.mp3"></audio>
<audio id="gusta" src="audio/me gusta cuando.mp3"></audio>
<audio id="musica" src="audio/musica.mp3"></audio>

<!-- ===== INTRO ===== -->
<div id="intro" class="scene">
  <h1 class="intro-text">
    Sofi, feliz día de la madre ❤️
  </h1>
</div>

<!-- ===== MENU ===== -->
<div id="menu" class="scene hidden">

  <div class="btn" onclick="openGallery('familia')">
    👨‍👩‍👧 Momentos en familia
  </div>

  <div class="btn" onclick="openGallery('felicidad')">
    😄 La felicidad
  </div>

  <div class="btn" onclick="openGallery('tesoro')">
    💎 Tu tesoro
  </div>

  <div class="btn" onclick="emocionarte()">
    💖 Para emocionarte
  </div>

  <div class="btn" onclick="compilado()">
    🎬 Ver todo con música
  </div>

  <div class="btn small" onclick="openSurprise()">
    📸 Sorpresa
  </div>

</div>

<!-- ===== VISOR ===== -->
<div id="viewer" class="scene hidden">

  <img id="viewerImg">

  <div class="nav">
    <button onclick="prev()">⬅</button>
    <button onclick="next()">➡</button>
  </div>

  <button onclick="back()">⬅ Volver</button>

</div>

<!-- ===== SELFIE ===== -->
<div id="selfie" class="scene hidden">

  <h2>💖 Abrazá a Isabela y sonrían</h2>

  <video id="cam" autoplay playsinline></video>

  <br>

  <button onclick="takePhoto()">📸 Sacar foto</button>

  <canvas id="canvas" class="hidden"></canvas>

  <div id="result"></div>

  <button onclick="back()">⬅ Volver</button>

</div>

<!-- ===== SCRIPT ===== -->
<script src="app.js"></script>

<script>
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("./service-worker.js");
}
</script>

</body>
</html>
