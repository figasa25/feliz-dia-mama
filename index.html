<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sofi ❤️</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ff2e63">

<link rel="stylesheet" href="style.css">
</head>

<body>

<canvas id="bg"></canvas>

<audio id="music" loop>
  <source src="audio/musica.mp3">
</audio>

<!-- INTRO -->
<div id="intro" class="scene active">
  <h1 class="intro-text">Sofi, feliz día de la madre ❤️</h1>
</div>

<!-- MENU -->
<div id="menu" class="scene hidden">
  <div class="btn" onclick="openGallery('familia')">👨‍👩‍👧 Familia</div>
  <div class="btn" onclick="openGallery('felicidad')">😄 Felicidad</div>
  <div class="btn" onclick="openGallery('tesoro')">💎 Tesoro</div>
  <div class="btn small" onclick="openSurprise()">💕 Sorpresa</div>
</div>

<!-- VIEWER -->
<div id="viewer" class="scene hidden">
  <img id="viewerImg">
  <div class="nav">
    <button onclick="prev()">⬅</button>
    <button onclick="next()">➡</button>
  </div>
  <button onclick="back()">Menú</button>
</div>

<!-- SELFIE -->
<div id="selfie" class="scene hidden">
  <video id="cam" autoplay playsinline></video>
  <button onclick="takePhoto()">📸 Foto</button>
  <canvas id="canvas" class="hidden"></canvas>
  <div id="result"></div>
</div>

<script src="app.js"></script>

<script>
if("serviceWorker" in navigator){
  navigator.serviceWorker.register("./service-worker.js");
}
</script>

</body>
</html>
